name: Build Pyzogram IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: false
        default: "debug_arm64"
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Generate self-signed codesigning identity (no Apple ID)
        run: |
          python3 build-system/generate_self_signed_codesigning.py

      - name: Import signing cert into keychain
        run: |
          security create-keychain -p pyzogram build.keychain
          security set-keychain-settings -t 21600 -u ~/Library/Keychains/build.keychain
          security unlock-keychain -p pyzogram ~/Library/Keychains/build.keychain
          security import codesigning/certs/dev.p12 -k ~/Library/Keychains/build.keychain -P pyzogram -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s ~/Library/Keychains/build.keychain login.keychain
          security default-keychain -s ~/Library/Keychains/build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k pyzogram ~/Library/Keychains/build.keychain

      - name: Build (Bazel via Make.py, self-signed — no Apple ID required)
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          python3 build-system/Make/Make.py --overrideXcodeVersion \
            --cacheDir ~/telegram-bazel-cache \
            build \
            --configurationPath build-system/appstore-configuration.json \
            --codesigningInformationPath codesigning \
            --buildNumber=1 \
            --configuration=${{ github.event.inputs.configuration || 'debug_arm64' }}

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pyzogram.ipa
          path: bazel-bin/Telegram/Telegram.ipa
          if-no-files-found: warn
