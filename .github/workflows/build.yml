name: Build Pyzogram IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: false
        default: "debug_arm64"
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Sign in to Xcode with Apple ID (free tier works)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          xcodes install 16 || true
          xcodes login "$APPLE_ID" --password "$APPLE_PASSWORD" || true

      - name: Build (Bazel via Make.py, Xcode-managed signing)
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          python3 build-system/Make/Make.py --overrideXcodeVersion \
            --cacheDir ~/telegram-bazel-cache \
            build \
            --configurationPath build-system/appstore-configuration.json \
            --xcodeManagedCodesigning true \
            --buildNumber=1 \
            --configuration=${{ github.event.inputs.configuration || 'debug_arm64' }}

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pyzogram.ipa
          path: bazel-bin/Telegram/Telegram.ipa
          if-no-files-found: warn
